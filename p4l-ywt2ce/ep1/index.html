    background: #000; color: #f5f5f5;

  h1 { font-size: 15px; font-weight: 500; color: #a8a8a8; margin: 0 0 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    max-width: 640px;
    margin: 0 auto;
  }
  .cell {
    position: relative;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    background: #1a1a1a;
    cursor: pointer;
  }
  .cell img {
    width: 100%; height: 100%;
    object-fit: contain; object-position: center;
    display: block;
  }
  .badge {
    position: absolute; top: 4px; right: 4px;
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    font-weight: 600; letter-spacing: 0.02em;
  }
  .badge-live { background: rgba(45, 168, 82, 0.9); color: #fff; }
  .badge-pending { background: rgba(120, 120, 120, 0.85); color: #fff; }
  .numtag {
    position: absolute; bottom: 4px; left: 4px;
    font-size: 11px; padding: 2px 6px; border-radius: 4px;
    background: rgba(0,0,0,0.55); color: #fff;
  }
  .updtag {
    position: absolute; top: 4px; left: 4px;
    font-size: 9px; padding: 1px 5px; border-radius: 4px;
    background: rgba(0,0,0,0.5); color: #ccc;
    letter-spacing: 0.01em;
  }
  .updtag-new {
    background: rgba(255, 122, 0, 0.92); color: #fff; font-weight: 700;
  }
  .modal {
    display: none;
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,0.92);
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal.open { display: flex; }
  .modal-inner {
    max-width: 420px; width: 100%;
  }
  .modal-inner video {
    width: 100%; max-height: 78vh;
    aspect-ratio: 9 / 16; object-fit: contain;
    background: #000; border-radius: 8px; display: block;
  }
  .modal-info {
    margin-top: 10px; font-size: 14px; color: #ddd;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .modal-info a { color: #4ea1ff; text-decoration: none; font-size: 13px; }
  .close-btn {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none; color: #fff; font-size: 28px;
    cursor: pointer; line-height: 1; padding: 4px 10px;

<div class="modal" id="modal">
  <button class="close-btn" id="closeBtn" aria-label="닫기">&times;</button>
  <div class="modal-inner">
    <video id="modalVideo" controls playsinline></video>
    <div class="modal-info">
      <span id="modalMeta"></span>
      <a id="modalLink" href="#" target="_blank" rel="noopener" style="display:none;">인스타그램에서 보기 ↗</a>
    </div>
  </div>
</div>

<script>
  const modal = document.getElementById('modal');
  const video = document.getElementById('modalVideo');
  const meta = document.getElementById('modalMeta');
  const link = document.getElementById('modalLink');

  function openModal(cell) {
    const d = cell.dataset;
    video.src = d.video;
    video.poster = d.cover;
    meta.textContent = `${d.num} · ${d.duration} · ${d.status} · 영상 갱신: ${d.updatedFull}`;
    if (d.permalink) {
      link.href = d.permalink;
      link.style.display = 'inline';
    } else {
      link.style.display = 'none';
    }
    modal.classList.add('open');
    video.play().catch(() => {});
  }

  function closeModal() {
    video.pause();
    video.src = '';
    modal.classList.remove('open');
  }

  document.querySelectorAll('.cell').forEach(cell => {
    cell.addEventListener('click', () => openModal(cell));
  });
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>
